[project]
name = "gt-free-ocr-metrics"
version = "1.0.0"
description = "Reference-free OCR evaluation via render-and-compare visual similarity"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
    "openai>=1.0",
    "Pillow>=10.0",
    "scikit-image>=0.21",
    "lpips>=0.1.4",
    "torch>=2.0",
    "torchvision>=0.15",
    "open-clip-torch>=2.24",
    "transformers>=4.35,<5.0",
    "beautifulsoup4>=4.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "mlflow>=2.10",
    "pandas>=2.0",
    "Levenshtein>=0.25",
    "lxml>=4.9",
    "tqdm>=4.65",
    "pdf2image>=1.16",
    "opencv-python>=4.8",
    "addict>=2.4",
    "easydict>=1.9",
    "einops>=0.6",
    "rapidfuzz>=3.0",
    "pylatexenc>=2.10",
    "apted>=1.0",
    "weasyprint>=66.0",
    "dreamsim>=0.2.1",
    "stlpips-pytorch>=0.0.2",
    "ipython>=8.18.1",
    "torchsummary>=1.5.1",
    "piq>=0.8.0",
    "pot>=0.9.6.post1",
    "torchmetrics>=1.8.2",
    "termcolor>=3.1.0",
    "colpali-engine>=0.3.13",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_free_ocr_metric"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
