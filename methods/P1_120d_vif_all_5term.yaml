id: P1_120d_vif_all_5term
name: "H10.1 VIF as 5th term in mc for variant=all only — info-theoretic orthogonal to DISTS"
category: deep_feature
script: scripts/methods/P1_120d_vif_all_5term.py
script_args: ""
parameters:
  vram_gb: 5
  encoder: dinov2_vitb14+openclip_vitb32+pyiqa_vif
  dino_size: 224
  batch_size: 16
dependencies: []
results_path: results/method_runs/ocr_{variant}/P1_120d_vif_all_5term/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_120d_vif_all_5term/correlations.json
description: >
  H10.1 (Branch 10 root): VIF (Visual Information Fidelity, Sheikh & Bovik 2006) as a 5th
  additive term in multi_composite for variant=all ONLY. Current H5.b formula for all:
    composite = 0.3*SSIM + 0.2*(1-MSE) + 0.2*(1-LPIPS) + 0.3*(1-DISTS)
  New 5-term formula (weights scaled down ~17%, VIF adds 0.20 share):
    composite = 0.25*SSIM + 0.15*(1-MSE) + 0.15*(1-LPIPS) + 0.25*(1-DISTS) + 0.20*VIF
  VIF is already higher=better in [0,1]; no inversion needed. VIF measures mutual information
  between reference and distorted image subbands via natural-scene-statistics — a fundamentally
  different mechanism from DISTS (texture statistics) and SSIM/LPIPS (structural/perceptual).
  All other variants (text/formula/table/all_no_mask) keep original 3-term formula UNCHANGED.
  clip_cosine path UNCHANGED for all variants (H6.1 logic preserved).
  Control: H6.1 (7331048, P1_120c3_table_clip_baseline_preproc, spearman_mean=0.3598, all mc=0.2834).
  Predicted: variant=all mc 0.2834 → 0.285-0.295; spearman_mean 0.3598 → 0.360-0.362.
date: "2026-04-26"
