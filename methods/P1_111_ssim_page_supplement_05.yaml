id: P1_111_ssim_page_supplement_05
name: "D111 — SSIM page-level structural similarity supplement β_ssim=0.05"
category: per_element_structure
script: scripts/methods/P1_111_ssim_page_supplement_05.py
script_args: ""
parameters:
  vram_gb: 10
  alpha_all: 0.3
  alpha_all_no_mask: 0.4
  beta_table_cell: 0.20
  beta_ssim: 0.05
dependencies:
  - models/docsim_lora/head_state_best.pt
  - data/ocr_logprobs/
  - data/omnidocbench/
results_path: results/method_runs/ocr_{variant}/P1_111_ssim_page_supplement_05/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_111_ssim_page_supplement_05/correlations.json
description: >
  D111 — adds SSIM page-level structural similarity as β_ssim=0.05 supplement on top of D107b.
  Computes SSIM between grayscale 512px versions of original and reconstructed pages
  (raw, not binarized). SSIM captures luminance, contrast, and local structure in a sliding
  window — complementary to DocSim's semantic feature space and Sobel's gradient edges.
  100% page coverage — no element detection needed.
  For all/all_no_mask:
    all: 0.45*page_DocSim + 0.30*entropy + 0.20*table_cell + 0.05*ssim
    all_no_mask: 0.35*page_DocSim + 0.40*entropy + 0.20*table_cell + 0.05*ssim
  KEEP if > 0.4820 (D107b best). Decision: KEEP→sweep β_ssim=0.10; REVERT→SSIM supplement closed.
date: "2026-05-01"
