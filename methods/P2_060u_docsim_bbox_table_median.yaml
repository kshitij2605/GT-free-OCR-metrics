id: P2_060u_docsim_bbox_table_median
name: "D60.u — D60.p with MEDIAN aggregation over per-table-bbox DocSim cosines (variant=table only)"
category: deep_feature
script: scripts/methods/P2_060u_docsim_bbox_table_median.py
script_args: ""
parameters:
  vram_gb: 10
  encoder: dinov2_vitb14+openclip_vitb32+lora_head_per_bbox_median
  docsim_variants: "text, all, all_no_mask (page-level); table (per-bbox MEDIAN)"
  baseline_variants: "formula (H4.e fusion); table-fallback (H6.1 CLIP-only when no bboxes)"
  bbox_source: ocr_table_elements.json
  bbox_aggregation: median
  empty_bbox_fallback: clip_only_h61
  dino_size: 224
  batch_size: 16
  adapter_path: models/docsim_lora/lora_adapter_best
  head_state_path: models/docsim_lora/head_state_best.pt
dependencies:
  - models/docsim_lora/head_state_best.pt
  - models/docsim_lora/config.json
results_path: results/method_runs/ocr_{variant}/P2_060u_docsim_bbox_table_median/results.json
correlations_path: results/method_runs/ocr_{variant}/P2_060u_docsim_bbox_table_median/correlations.json
description: >
  D60.u — single-line variation of D60.p: aggregate per-table-bbox DocSim
  cosines via MEDIAN instead of MIN. Hypothesis: tests outlier robustness
  of the worst-cell signal. If MIN's win over MEAN is driven by structural
  worst-cell-error correlation with total OCR error, MEDIAN should
  regress (closer to MEAN). If MIN's win was outlier-driven (one bad
  rendering artifact dominating MIN), MEDIAN should improve.
  Other 4 variants byte-equal to D60.p.
  Predicted spearman_mean: 0.440-0.450, most likely 0.4435 (between MIN
  0.4453 and MEAN 0.4432). KEEP if >= 0.450. Kill switch: table cc
  <= 0.45.
  Control: D60.p (P2_060p_docsim_bbox_table_min, 0.4453, table cc 0.4767).
date: "2026-04-29"
