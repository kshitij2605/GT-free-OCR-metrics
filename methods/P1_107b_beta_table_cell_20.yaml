description: >
  D107b — sweeps β=0.20 for per-table-cell MIN DocSim supplement on all/all_no_mask.
  D107 at β=0.10 KEEPed with all end_to_end 0.4209→0.4228 (+0.0019), spearman_mean
  0.4814→0.4818. Hypothesis: higher β=0.20 continues the lift (more weight on
  content-homogeneous cell-level signal). For pages with table bboxes:
    all: 0.50*page_DocSim + 0.30*entropy + 0.20*cell_MIN
    all_no_mask: 0.40*page_DocSim + 0.40*entropy + 0.20*cell_MIN
  KEEP if > 0.4818. Decision: KEEP→sweep β=0.30; REVERT-tie→β peak at 0.10.
