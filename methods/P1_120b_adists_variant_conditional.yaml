id: P1_120b_adists_variant_conditional
name: "H5.b Variant-conditional multi_composite: DISTS-augmented only for variant=all"
category: deep_feature
script: scripts/methods/P1_120b_adists_variant_conditional.py
script_args: ""
parameters:
  vram_gb: 4
  encoder: dinov2_vitb14+openclip_vitb32
  dino_size: 224
  batch_size: 16
dependencies: []
results_path: results/method_runs/ocr_{variant}/P1_120b_adists_variant_conditional/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_120b_adists_variant_conditional/correlations.json
description: >
  H5.b: Variant-conditional multi_composite formula. For variant=all: use DISTS-augmented
  rebalanced composite (0.3*SSIM + 0.2*(1-MSE) + 0.2*(1-LPIPS) + 0.3*(1-DISTS)) — capturing
  the +0.009 all-variant gain seen in H5. For all other variants (text, formula, table,
  all_no_mask): keep original composite (0.4*SSIM + 0.3*(1-MSE) + 0.3*(1-LPIPS)) — no
  rebalancing cost, so no text regression. clip_cosine strategy from H4.e UNCHANGED:
  variant=table uses CLIP-only; all others use 50/50 CLIP+DINOv2 average.
  Control: H4.e (9d0067f, spearman_mean=0.3562).
  Predicted: spearman_mean ~ 0.358 (+0.002 vs H4.e).
date: "2026-04-26"
