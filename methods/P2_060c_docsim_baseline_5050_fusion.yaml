id: P2_060c_docsim_baseline_5050_fusion
name: "D60.c — DocSim + baseline 50/50 cc fusion for {all, all_no_mask}"
category: deep_feature
script: scripts/methods/P2_060c_docsim_baseline_5050_fusion.py
script_args: ""
parameters:
  vram_gb: 10
  encoder: dinov2_vitb14+openclip_vitb32+lora_head_conditional
  fusion_weight_docsim: 0.5
  fusion_weight_baseline: 0.5
  dino_size: 224
  batch_size: 16
  adapter_path: models/docsim_lora/lora_adapter_best
  head_state_path: models/docsim_lora/head_state_best.pt
dependencies:
  - models/docsim_lora/head_state_best.pt
  - models/docsim_lora/config.json
results_path: results/method_runs/ocr_{variant}/P2_060c_docsim_baseline_5050_fusion/results.json
correlations_path: results/method_runs/ocr_{variant}/P2_060c_docsim_baseline_5050_fusion/correlations.json
description: >
  D60.c — refinement of D60.b. For variants {all, all_no_mask}, the
  clip_cosine slot returns 0.5*DocSim_cos + 0.5*baseline_cos, where
  baseline_cos is the H4.e 50/50 CLIP+DINOv2 fusion on raw RGB. Other
  variants {text, formula, table} unchanged from P2_060b/P1_120c3b.
  Tests whether the trained DocSim cosine carries unique signal vs
  whether ensembling with the unsupervised baseline preserves or lifts
  the gain.
  Predicted spearman_mean: 0.385-0.395 (most likely tie or marginal).
  - If pure DocSim signal dominates: ~tie at 0.39 (no lift, no harm)
  - If baseline carries complementary info: small lift to ~0.40
  - If baseline pulls down: regress toward (0.3935+0.3600)/2 ~ 0.377
  KEEP if >= 0.395.
  Control: P2_060b D60.b (commit a2e76e1, spearman_mean=0.3935).
date: "2026-04-28"
