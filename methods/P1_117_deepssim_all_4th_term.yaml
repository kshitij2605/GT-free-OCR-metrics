id: P1_117_deepssim_all_4th_term
name: "H14.X / D117 DeepDC (pyiqa) as 4th term REPLACING DISTS for variant=all only"
category: deep_feature
script: scripts/methods/P1_117_deepssim_all_4th_term.py
script_args: ""
parameters:
  vram_gb: 4
  encoder: dinov2_vitb14+openclip_vitb32
  dino_size: 224
  batch_size: 16
dependencies: []
results_path: results/method_runs/ocr_{variant}/P1_117_deepssim_all_4th_term/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_117_deepssim_all_4th_term/correlations.json
description: >
  H14.X / D117: Sibling REFINE under H5.b confirmed slot. Replaces DISTS with DeepDC
  (pyiqa metric name "deepdc", DeepDC: Correcting Semantic Degradation for Perceptual
  Image Compression via Deep Discriminative Correlation) as the 4th term in the
  variant=all multi_composite formula.

  DeepSSIM (as specified in the experiment plan, D117) is NOT available in pyiqa by
  that exact name. Available metrics with "ssim" or "deep": cw_ssim, deepdc, ms_ssim,
  ssim, ssimc. DeepDC (deepdc) was selected as the closest mechanistic substitute:
  lower_better=True, score_range=[0,1], uses deep features for perceptual quality
  assessment — analogous to DISTS's deep-feature stat averages, making it the most
  structurally appropriate swap candidate in the DISTS slot.

  multi_composite formulas:
    variant=all (USE_DEEPDC=True):
      composite = 0.3*SSIM + 0.2*(1-MSE) + 0.2*(1-LPIPS) + 0.3*(1-DeepDC)
      (same shape as H5.b DISTS slot: 0.3*SSIM + 0.2*(1-MSE) + 0.2*(1-LPIPS) + 0.3*(1-DISTS))
    all other variants (USE_DEEPDC=False):
      composite = 0.4*SSIM + 0.3*(1-MSE) + 0.3*(1-LPIPS)  (original, unchanged)

  clip_cosine strategy (UNCHANGED from H4.e + H6.1 baseline):
    variant=table: CLIP-only with grayscale+SHARPEN+autocontrast preprocessing (H6.1)
    variant=all_no_mask: 50/50 CLIP+DINOv2 fusion with H6.1 preprocessing (H11.2)
    all other variants: 50/50 CLIP+DINOv2 fusion, raw RGB

  Control: H11.2 (89aee86, spearman_mean=0.3600).
  Predicted: spearman_mean ~ 0.358 +/- 0.003. KEEP if >= 0.3605.
