id: P1_084g_dinov2_only_all_no_mask
name: "H11.1 DINOv2 CLS-only for variant=all_no_mask cc only — encoder specialist"
category: deep_feature
script: scripts/methods/P1_084g_dinov2_only_all_no_mask.py
script_args: ""
parameters:
  vram_gb: 4
  encoder: dinov2_vitb14+openclip_vitb32
  dino_size: 224
  batch_size: 16
dependencies: []
results_path: results/method_runs/ocr_{variant}/P1_084g_dinov2_only_all_no_mask/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_084g_dinov2_only_all_no_mask/correlations.json
description: >
  H11.1: REFINE of H6.1 (P1_120c3). Variant-conditional encoder swap for variant=all_no_mask
  clip_cosine slot ONLY. Prior P1_084 leaderboard data shows DINOv2-CLS-only achieves
  all_no_mask cc=0.310, slightly above the 50/50 CLIP+DINOv2 fusion used by H4.e/H6.1
  (all_no_mask cc=0.3073). This experiment tests whether DINOv2-CLS-only (plain RGB,
  no CLIP, no fusion) breaks the 0.3073 ceiling for this variant without disturbing
  the other 4 variants' carefully-tuned settings.

  Per-variant logic:
  - variant=text      -> 50/50 CLIP+DINOv2 fusion (H4.e default, unchanged)
  - variant=formula   -> 50/50 CLIP+DINOv2 fusion (H4.e default, unchanged)
  - variant=table     -> CLIP-only with H6.1 grayscale+SHARPEN+autocontrast->RGB preprocessing (unchanged)
  - variant=all       -> 50/50 CLIP+DINOv2 fusion (H4.e default, unchanged)
  - variant=all_no_mask -> DINOv2 vitb14 CLS-only, plain RGB (NEW — no CLIP contribution)

  Control: H6.1 (7331048, P1_120c3_table_clip_baseline_preproc, spearman_mean=0.3598).
  Predicted: spearman_mean ~ 0.360-0.365
  (all_no_mask cc 0.3073->0.310, +0.003; other variants unchanged;
   delta to mean = +0.003/5 = ~+0.001 to +0.006 depending on gap magnitude).
