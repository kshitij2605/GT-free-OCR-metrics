id: P1_025_ms_swd_table_4th_term
name: "H2 MS-SWD as 4th term in multi_composite for variant=table"
category: deep_feature
script: scripts/methods/P1_025_ms_swd_table_4th_term.py
script_args: ""
parameters:
  vram_gb: 4
  encoder: dinov2_vitb14+openclip_vitb32
  dino_size: 224
  batch_size: 16
dependencies: []
results_path: results/method_runs/ocr_{variant}/P1_025_ms_swd_table_4th_term/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_025_ms_swd_table_4th_term/correlations.json
description: >
  H2 (Branch 2 reactivation): MS-SWD (Multi-scale Sliced Wasserstein Distance via pyiqa msswd)
  as 4th additive term in multi_composite for variant=table only. Variant-conditional formula:
    variant=all: DISTS-augmented composite (0.3*SSIM + 0.2*(1-MSE) + 0.2*(1-LPIPS) + 0.3*(1-DISTS)) — preserves H5.b best
    variant=table: MS-SWD-augmented composite (0.3*SSIM + 0.2*(1-MSE) + 0.2*(1-LPIPS) + 0.3*ms_swd_sim)
    variant=text/formula/all_no_mask: original composite (0.4*SSIM + 0.3*(1-MSE) + 0.3*(1-LPIPS))
  ms_swd_sim = 1 / (1 + msswd_distance).
  clip_cosine strategy from H4.e UNCHANGED: variant=table uses CLIP-only; all others use 50/50 CLIP+DINOv2 average.
  Hypothesis: DISTS as table 4th term raised table mc 0.250→0.263 (H5.e) but stayed below cc=0.268 ceiling.
  MS-SWD's sliced Wasserstein distributional alignment should capture table grid positional mismatch better,
  pushing table mc above 0.268 ceiling.
  Control: H5.b (bedac9a, spearman_mean=0.3581).
  Predicted: spearman_mean 0.358-0.370 (table mc 0.27-0.32).
date: "2026-04-26"
