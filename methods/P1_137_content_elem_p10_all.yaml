id: P1_137_content_elem_p10_all
name: "D137 — Per-content-element CLIP P10 supplement for all/all_no_mask"
category: composite
script: scripts/methods/P1_137_content_elem_p10_all.py
script_args: ""
parameters:
  vram_gb: 8
  beta_ssim_table: 0.15
  beta_ssim_text: 0.15
  beta_ssim_all: 0.20
  beta_ssim_all_no_mask: 0.10
  beta_ssim_formula: 0.05
  beta_content_elem_all: 0.10
  beta_content_elem_all_no_mask: 0.10
  ssim_size: 512
dependencies:
  - data/omnidocbench/
  - models/docsim_lora/
  - data/ocr_logprobs/
  - data/ocr_logprobs_per_bbox/
results_path: results/method_runs/ocr_{variant}/P1_137_content_elem_p10_all/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_137_content_elem_p10_all/correlations.json
description: >
  D137 — New mechanism class: per-content-element CLIP P10 for all/all_no_mask.
  all/all_no_mask stuck at 0.4458/0.4461 across 24+ experiments. Extends per-cell-MIN
  breakthrough (D60) to ALL content types: loads text+formula+table element bboxes,
  computes CLIP cosine on each crop, aggregates with P10 (10th percentile).
  β_elem=0.10: all = 0.30*DocSim+0.30*entropy+0.15*table_cell+0.15*ssim+0.10*elem_p10
               all_no_mask = 0.30*DocSim+0.40*entropy+0.10*table_cell+0.10*ssim+0.10*elem_p10
  Baseline: D133 (0.4927). KEEP if spearman_mean > 0.4927.
