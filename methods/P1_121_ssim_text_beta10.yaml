id: P1_121_ssim_text_beta10
name: "D121 — SSIM text β=0.10 (text=0.10, all=0.15, all_no_mask=0.10)"
category: composite
script: scripts/methods/P1_121_ssim_text_beta10.py
script_args: ""
parameters:
  vram_gb: 8
  beta_ssim_text: 0.10
  beta_ssim_all: 0.15
  beta_ssim_all_no_mask: 0.10
  ssim_size: 512
dependencies:
  - data/omnidocbench/
  - models/docsim_lora/
  - data/ocr_logprobs/
  - data/ocr_logprobs_per_bbox/
results_path: results/method_runs/ocr_{variant}/P1_121_ssim_text_beta10/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_121_ssim_text_beta10/correlations.json
description: >
  D121 — SSIM text β sweep step 2: text=0.10 (up from D120's 0.05).
  D120 confirmed text SSIM at β=0.05 lifts text Spearman 0.4640→0.4710 (+0.0070).
  D121 tests whether doubling to β=0.10 continues the trend.
  text: 0.50*DocSim + 0.40*entropy + 0.10*ssim (reduces DocSim 0.55→0.50)
  all: 0.35*DocSim + 0.30*entropy + 0.15*table_cell + 0.15*ssim (unchanged from D120)
  all_no_mask: 0.30*DocSim + 0.40*entropy + 0.20*table_cell + 0.10*ssim (unchanged from D120)
  KEEP if spearman_mean > 0.4891 (D120 baseline).
