id: P1_110_multiscale_sobel_supplement_05
name: "D110 — Multi-scale Sobel edge-map cosine similarity supplement β_ms_edge=0.05"
category: per_element_structure
script: scripts/methods/P1_110_multiscale_sobel_supplement_05.py
script_args: ""
parameters:
  vram_gb: 10
  alpha_all: 0.3
  alpha_all_no_mask: 0.4
  beta_table_cell: 0.20
  beta_ms_sobel_edge: 0.05
dependencies:
  - models/docsim_lora/head_state_best.pt
  - data/ocr_logprobs/
  - data/omnidocbench/
results_path: results/method_runs/ocr_{variant}/P1_110_multiscale_sobel_supplement_05/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_110_multiscale_sobel_supplement_05/correlations.json
description: >
  D110 — adds multi-scale Sobel edge-map cosine similarity as β_ms_edge=0.05 supplement on top of D107b.
  Computes Sobel edge maps at 3 spatial scales (1x, 0.5x, 0.25x), averages cosine similarities.
  Multi-scale captures both fine character-level edges (1x) and coarse layout-block edges (0.25x),
  more robust than single-scale D109 to font-size / zoom variation.
  100% page coverage — no element detection needed.
  For all/all_no_mask:
    all: 0.45*page_DocSim + 0.30*entropy + 0.20*table_cell + 0.05*ms_sobel
    all_no_mask: 0.35*page_DocSim + 0.40*entropy + 0.20*table_cell + 0.05*ms_sobel
  KEEP if > 0.4820 (D107b best). Decision: KEEP→sweep β_ms_edge=0.10; REVERT→multi-scale Sobel closed.
date: "2026-05-01"
