category: self_uncertainty
script: scripts/methods/P1_106d_iq_fusion_table.py
script_args: ""
parameters:
  vram_gb: 10
  alpha_table: 0.0
  gamma_diqa_table: 0.1
  gamma_diqa_formula: 0.2
dependencies:
  - models/docsim_lora/head_state_best.pt
  - data/ocr_logprobs/
  - data/ocr_logprobs_per_bbox/
results_path: results/method_runs/ocr_{variant}/P1_106d_iq_fusion_table/results.json
