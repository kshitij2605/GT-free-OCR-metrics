description: >
  D106.d — first fusion attempt on variant=table. Table has been
  alpha_entropy=0 (no entropy fusion) since D215.b — the table channel
  is purely D60.p per-cell-MIN DocSim cosine (0.4767). Test whether
  hand-crafted IQ features add complementary signal to per-cell DocSim:
      table clip_cosine = 0.9 * prod_cc + 0.1 * D106_iq_similarity
  Other variants byte-equal to D106.b (formula keeps gamma=0.2).
  D106 alone on table=0.2966, much weaker than prod_cc=0.4767, but
  small gamma might still add via independence.
  Predicted: table 0.4760-0.4800 (likely +0-0.003); spearman_mean:
  0.4795-0.4810 (likely +0-0.001). KEEP if > 0.4804.
  Decision: KEEP -> NEW BEST -> PROCEED to broader IQ-fusion sweep;
  REVERT-tie -> table fusion structurally infeasible at this gamma;
  table is locked at D60.p 0.4767.
  Control: D106.b (0.4804, table gamma=0).
