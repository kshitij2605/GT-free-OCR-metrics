description: >
  D215.i — combine per-variant alpha + per-variant window_k from sweeps.
  D215.e (variant-conditional alpha, K=10) achieved 0.4638. K-sweep
  (D215.g K=5, D215.h K=20) revealed per-variant K optima: K=5 lifts
  text/all/all_no_mask, K=20 lifts formula. Sum-of-per-variant-bests:
    text K=5 alpha=0.4 -> 0.4403
    formula K=20 alpha=0.4 -> 0.5784
    table alpha=0 -> 0.4767
    all K=5 alpha=0.3 -> 0.4088
    all_no_mask K=5 alpha=0.4 -> 0.4306
  Mean = 0.4670 projected (+0.0032 vs D215.e 0.4638).
  Predicted: 0.4660-0.4685. KEEP if >= 0.466.
  Tests whether per-variant K and alpha optima compose without interaction
  effects (D215.e showed alpha routes did so cleanly).
  Control: D215.e (0.4638).
