id: P1_215e_alpha_variant_conditional
name: "D215.e — variant-conditional alpha fusion (table=0, all=0.3, others=0.4)"
category: self_uncertainty
script: scripts/methods/P1_215e_alpha_variant_conditional.py
script_args: ""
parameters:
  vram_gb: 10
  alpha_table: 0.0
  alpha_all: 0.3
  alpha_text: 0.4
  alpha_formula: 0.4
  alpha_all_no_mask: 0.4
  window_k: 10
dependencies:
  - models/docsim_lora/head_state_best.pt
  - models/docsim_lora/config.json
  - data/ocr_logprobs/
results_path: results/method_runs/ocr_{variant}/P1_215e_alpha_variant_conditional/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_215e_alpha_variant_conditional/correlations.json
description: >
  D215.e — variant-conditional alpha based on D215.b/c/d sweep findings:
    table:                 alpha=0.0 (entropy DILUTES per-cell-MIN signal)
    all:                   alpha=0.3 (peak at 0.4061)
    text/formula/all_no_mask: alpha=0.4 (still climbing at sweep top)
  Sum-of-per-variant-bests: 0.4767 + 0.4359 + 0.5760 + 0.4061 + 0.4242 = 2.3189 / 5 = 0.4638.
  Predicted: 0.4625-0.4655, most likely 0.4638 (+0.0038 vs D215.c uniform 0.3).
  KEEP if >= 0.461 (above D215.c noise band).
  Kill switch: if ANY variant regresses below the corresponding sweep best,
  the per-variant routing is wrong (route assignment failure).
  Control: D215.c (commit just before, alpha=0.3 uniform 0.4600).
