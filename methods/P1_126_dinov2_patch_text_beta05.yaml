id: P1_126_dinov2_patch_text_beta05
name: "D126 — DINOv2 patch mean cosine supplement for text β=0.05"
category: composite
script: scripts/methods/P1_126_dinov2_patch_text_beta05.py
script_args: ""
parameters:
  vram_gb: 8
  beta_dino_patch_text: 0.05
  beta_ssim_text: 0.15
  beta_ssim_all: 0.15
  beta_ssim_all_no_mask: 0.10
  beta_ssim_formula: 0.05
  ssim_size: 512
dependencies:
  - data/omnidocbench/
  - models/docsim_lora/
  - data/ocr_logprobs/
  - data/ocr_logprobs_per_bbox/
results_path: results/method_runs/ocr_{variant}/P1_126_dinov2_patch_text_beta05/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_126_dinov2_patch_text_beta05/correlations.json
description: >
  D126 — DINOv2 patch-level mean cosine similarity supplement for text variant at β=0.05.
  Based on D124 stack (NEW BEST 0.49084). Adds positional patch-level DINOv2 cosine similarity
  as a complement to whole-image DocSim. Text formula becomes:
  0.40*DocSim + 0.40*entropy + 0.15*ssim + 0.05*dino_patch (reduces DocSim 0.45→0.40).
  Hypothesis: patch features capture local character-level structure complementary to global DocSim.
  KEEP if spearman_mean > 0.4908 (D124 NEW BEST).
