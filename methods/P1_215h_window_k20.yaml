id: P1_215h_window_k20
name: "D215.h — variant-conditional fusion with larger window K=20"
category: self_uncertainty
script: scripts/methods/P1_215h_window_k20.py
script_args: ""
parameters:
  vram_gb: 10
  window_k: 20
  alpha_table: 0.0
  alpha_all: 0.3
  alpha_text: 0.4
  alpha_formula: 0.4
  alpha_all_no_mask: 0.4
