description: >
  D215.h — same variant-conditional alpha as D215.e but with larger window
  K=20 (instead of K=10) for the rolling-window MIN of per-token confidence.
  Larger window smooths token-level noise — captures sustained low-confidence
  regions only. May lift if K=10 was too noisy; may hurt if it smears short
  error bursts.
  Predicted: 0.460-0.470, most likely 0.464 (+0.001 vs D215.e 0.4638).
  KEEP if >= 0.466.
  Control: D215.e (window K=10, 0.4638).
