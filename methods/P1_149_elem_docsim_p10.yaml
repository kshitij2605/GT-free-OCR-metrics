id: P1_149_elem_docsim_p10
name: "D149 — per-element DocSim P10 (vs CLIP P10)"
category: composite
script: scripts/methods/P1_149_elem_docsim_p10.py
script_args: ""
parameters:
  vram_gb: 8
  ssim_size: 512
  beta_ssim_table: 0.15
  beta_ssim_text: 0.15
  beta_ssim_all: 0.20
  beta_ssim_all_no_mask: 0.10
  beta_ssim_formula: 0.05
  beta_content_elem_all: 0.10
  beta_content_elem_all_no_mask: 0.10
dependencies:
  - data/omnidocbench/
  - models/docsim_lora/
  - data/ocr_logprobs/
  - data/ocr_logprobs_per_bbox/
results_path: results/method_runs/ocr_{variant}/P1_149_elem_docsim_p10/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_149_elem_docsim_p10/correlations.json
description: >
  D149 — per-element DocSim P10 vs CLIP P10. All weights from D137.
  Single change: element-level similarity uses _docsim_cosine_batch (fine-tuned CLIP+DINOv2 LoRA)
  instead of raw _clip_cosine_batch_plain in _content_element_clip_p10().
  Hypothesis: document-specific DocSim features predict per-element OCR quality better
  than generic CLIP features for mixed-content document pages.
  KEEP if spearman_mean > 0.4932 (D137).
