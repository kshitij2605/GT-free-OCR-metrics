id: P2_193_pp_doclayout_disagreement
name: "D193 DocLayout-YOLO layout-profile disagreement for variant=all only"
category: layout_detector
script: scripts/methods/P2_193_pp_doclayout_disagreement.py
script_args: ""
parameters:
  vram_gb: 6
  model: doclayout_yolo_docstructbench_imgsz1024
  imgsz: 1024
  conf_threshold: 0.25
  non_text_classes: "figure,table,isolate_formula,figure_caption,table_caption,table_footnote,formula_caption"
  scope_variants: "all only (text/formula/table/all_no_mask pass through H11.2 baseline)"
dependencies:
  - doclayout-yolo
results_path: results/method_runs/ocr_{variant}/P2_193_pp_doclayout_disagreement/results.json
correlations_path: results/method_runs/ocr_{variant}/P2_193_pp_doclayout_disagreement/correlations.json
description: >
  D193 (Phase 2, Priority high): Cross-model layout-classifier disagreement signal.
  Hypothesis: DocLayout-YOLO's layout class distribution (fraction of page area
  classified as non-text: formula, table, figure, captions) should be more similar
  between GT and a high-quality reconstruction than between GT and a low-quality one.
  Score = 1 - |nontext_area_fraction_GT - nontext_area_fraction_recon|, clipped to
  [0,1]. High score = layout structures are preserved; low score = OCR misclassified
  or misrendered non-text regions as text (or vice versa).

  Mechanism: DocLayout-YOLO (YOLOv10, DocStructBench pretrained, imgsz=1024, conf=0.25)
  predicts bboxes + classes {title, plain_text, abandon, figure, figure_caption, table,
  table_caption, table_footnote, isolate_formula, formula_caption} on each page image.
  Non-text classes {figure, table, isolate_formula, figure_caption, table_caption,
  table_footnote, formula_caption} form the "structure fraction". Score is emitted as
  BOTH multi_composite.composite AND clip_compare.clip_cosine so best_over_metrics in
  the eval pipeline evaluates both channels.

  Scope: ONLY variant=all computes the new signal. For text, formula, table, all_no_mask
  this script reads results from H11.2 baseline
  (P1_120c3b_all_no_mask_baseline_preproc/results.json) and writes them verbatim. This
  isolates the D193 probe to variant=all without risking regression on the other 4
  variants.

  Control: H11.2 (P1_120c3b_all_no_mask_baseline_preproc), spearman_mean=0.3600.
  variant=all current best: mc=0.283 (DISTS-augmented composite). D193 must beat 0.283
  on variant=all to improve overall spearman_mean.

  Predicted spearman_mean: 0.358-0.366 (conservative). The layout-profile disagreement
  is a fundamentally different mechanism class (cross-model layout-classifier) not
  subject to the slot-interior or preprocessing axis closures documented in
  prior method-catalog notes. If variant=all cc (=mc via duplication) rises above 0.283, overall
  spearman_mean improves.

  Kill switch: if variant=all mc+cc <= 0.267 (worse than current best by >0.016), the
  DocLayout layout-profile delta is not predictive of OCR quality for mixed-content
  pages. Revert and mark dead_end.

  Model weights: pre-cached at
  ~/.cache/huggingface/hub/models--juliozhao--DocLayout-YOLO-DocStructBench/
  No download needed at eval time. Package: doclayout-yolo==0.0.4 (installed 2026-04-28).

