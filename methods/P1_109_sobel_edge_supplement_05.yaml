id: P1_109_sobel_edge_supplement_05
name: "D109 — Sobel edge-map cosine similarity supplement β_edge=0.05"
category: per_element_structure
script: scripts/methods/P1_109_sobel_edge_supplement_05.py
script_args: ""
parameters:
  vram_gb: 10
  alpha_all: 0.3
  alpha_all_no_mask: 0.4
  beta_table_cell: 0.20
  beta_sobel_edge: 0.05
dependencies:
  - models/docsim_lora/head_state_best.pt
  - data/ocr_logprobs/
  - data/omnidocbench/
results_path: results/method_runs/ocr_{variant}/P1_109_sobel_edge_supplement_05/results.json
correlations_path: results/method_runs/ocr_{variant}/P1_109_sobel_edge_supplement_05/correlations.json
description: >
  D109 — adds Sobel edge-map cosine similarity as β_edge=0.05 supplement on top of D107b.
  Converts original and reconstructed pages to grayscale, applies scipy.ndimage.sobel
  (X+Y), computes cosine similarity between flattened edge magnitude maps.
  Captures structural/layout fidelity (text line presence, block boundaries)
  independent from content similarity (DocSim) and hash-based signals (D68).
  100% page coverage — no element detection needed.
  For all/all_no_mask:
    all: 0.45*page_DocSim + 0.30*entropy + 0.20*table_cell + 0.05*sobel_edge
    all_no_mask: 0.35*page_DocSim + 0.40*entropy + 0.20*table_cell + 0.05*sobel_edge
  KEEP if > 0.4820 (D107b best). Decision: KEEP→sweep β_edge=0.10; REVERT→Sobel edge closed.
